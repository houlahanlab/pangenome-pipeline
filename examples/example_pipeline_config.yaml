---
project_name: TEST
project_directory: /path/to/project/directory

# reference files
ref_gbz: /path/to/reference/files/hprc_v1.1_grch38/hprc-v1.1-mc-grch38.d9.gbz
ref_dist: /path/to/reference/files/hprc_v1.1_grch38/hprc-v1.1-mc-grch38.d9.dist
ref_min: /path/to/reference/files/hprc_v1.1_grch38/hprc-v1.1-mc-grch38.d9.min
ref_paths: /path/to/reference/files/hprc_v1.1_grch38/grch38_linear.dict
ref_pattern: 'GRCh38#0#'

reference: /path/to/reference/files/hprc_v1.1_grch38/grch38_linear_fixed.fa
known_indels: /path/to/reference/files/Homo_sapiens_assembly38.known_indels.vcf
pon: /path/to/reference/files/1000g_pon.hg38.vcf.gz
germline_resource: /path/to/reference/files/af-only-gnomad.hg38.vcf.gz
target_regions: /path/to/reference/files/Agilent_SureSelect_All_Exon_V5.bed.gz # or 'chr21'

# tool versions
container_path: 'apptainer exec pangenome-pipeline_v1.sif'

vg_path: 'apptainer exec pangenome-pipeline_v1.sif vg' # or just 'vg' if in your PATH
gatk_path: 'apptainer exec pangenome-pipeline_v1.sif gatk' # or just 'gatk' if in your PATH
samtools_path: 'apptainer exec pangenome-pipeline_v1.sif samtools' # or just 'samtools' if in your PATH
bcftools_path: 'apptainer exec pangenome-pipeline_v1.sif bcftools' # or just 'bcftools' if in your PATH
bgzip_path: 'apptainer exec pangenome-pipeline_v1.sif bgzip' # or just 'bgzip' if in your PATH
tabix_path: 'apptainer exec pangenome-pipeline_v1.sif tabix' # or just 'tabix' if in your PATH

strelka_path: 'apptainer exec pangenome-pipeline_v1.sif'

somaticsniper_path: '/path/to/software/somatic-sniper'
readcount_path: 'apptainer exec /path/to/software/bam-readcount_1.0.1.sif'
deepsomatic_path: 'apptainer exec /path/to/software/deepsomatic_1.10.0.sif'

# parameters
giraffe:
  time: '8:0:0'
  mem: '48G'
  cpus: 2
gatk:
  time: '8:0:0'
  mem: '8G'
  cpus: 2
strelka:
  ref: /path/to/reference/files/hprc_v1.1_grch38/grch38_linear_fixed.fa
  time: '4:0:0'
  mem: '12G'
  cpus: 1
mutect2:
  time: '4:0:0'
  mem: '4G'
  cpus: 1
somaticsniper:
  time: '4:0:0'
  mem: '4G'
  cpus: 1
deepsomatic:
  model: WES # either WES, WGS, FFPE_WES or FFPE_WGS; TUMOR_ONLY tag will be added automatically if relevant
  time: '12:0:0'
  mem: '26G'
  cpus: 4
